name: Docs drift check

on:
  pull_request:
    paths:
      - "docs/**"
      - "releases/**"
      - "product-facts.yml"
  schedule:
    - cron: "0 7 * * 1"   # every Monday, 07:00 UTC
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Fails the job when something is provably wrong (stale or error).
      # "review" findings are reported but do not fail; a person clears them.
      - name: Run drift check
        run: python scripts/drift_check.py --report reports/drift-report.md --fail-on stale,error

      - name: Show report in the job summary
        if: always()
        run: cat reports/drift-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: reports/drift-report.md
